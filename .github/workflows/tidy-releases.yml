name: tidy releases

# Run once by hand, from main: the standard game, released as v1.2.2, becomes
# v1.0.0, tagged on this commit (the same code, numbered 1.0.0), and the old
# v1.0.0 tag goes. v1.3.0 stays the version with Best-Reply Search. The
# release keeps its files, which carry no version number. Removed again
# after it has run.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Only once
        id: check
        run: |
          if gh release view v1.2.2 > /dev/null 2>&1; then
            echo "todo=yes" >> "$GITHUB_OUTPUT"
          else
            echo "v1.2.2 is already v1.0.0, nothing to do"
          fi
      - name: Replace the old v1.0.0 tag with one on this commit
        if: steps.check.outputs.todo == 'yes'
        run: |
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/v1.0.0" || true
          gh api "repos/${GH_REPO}/git/refs" -f ref=refs/tags/v1.0.0 -f sha="${GITHUB_SHA}"
      - name: Turn the v1.2.2 release into v1.0.0
        if: steps.check.outputs.todo == 'yes'
        run: |
          cat > notes.md <<'NOTES'
          **The standard game.** Tactical Formation (Cờ Trận), a Vietnamese folk board game for 2–4 players: play each other on one computer, or play bots at Easy, Medium or Hard. The 2-player bot uses Minimax and the 3- and 4-player bots use Paranoid search; Easy, Medium and Hard search 3, 4 and 5 moves ahead, at most about 2 seconds a move.

          The other version, [v1.3.0](https://github.com/GLOMQuyet/Tactical-Formation-The-Board-Game/releases/tag/v1.3.0), is the same game with Best-Reply Search for the 3- and 4-player bots.

          ## Download

          | System | File |
          |---|---|
          | Windows | `TacticalFormation-Windows-amd64.exe` |
          | macOS (Apple Silicon) | `TacticalFormation-macOS-arm64.dmg` |
          | Linux (glibc 2.35 or newer) | `TacticalFormation-Linux-x86_64` |

          The files are not signed; the [README](https://github.com/GLOMQuyet/Tactical-Formation-The-Board-Game#download-no-python-needed) says how to open them the first time.
          NOTES
          gh release edit v1.2.2 --tag v1.0.0 --title "Tactical Formation v1.0.0 (standard)" \
            --notes-file notes.md --latest
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/v1.2.2"
      - name: Point v1.3.0's notes at v1.0.0
        if: steps.check.outputs.todo == 'yes'
        run: |
          gh release view v1.3.0 --json body --jq .body | grep -v '^\*\*Full Changelog\*\*' > notes.md
          printf '\nThe standard version is [v1.0.0](https://github.com/GLOMQuyet/Tactical-Formation-The-Board-Game/releases/tag/v1.0.0).\n' >> notes.md
          gh release edit v1.3.0 --notes-file notes.md
