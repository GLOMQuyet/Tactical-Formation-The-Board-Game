name: tidy releases

# Run once by hand: keeps the two versions of the game, v1.2.2 (standard)
# and v1.3.0 (with Best-Reply Search), and deletes the older releases and
# their tags. Removed again after it has run.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete the older releases and their tags
        run: |
          for tag in v1.1.0 v1.1.1 v1.2.0 v1.2.1; do
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done
      - name: Name the two that stay, the standard one as the latest
        run: |
          note() {
            body=$(gh release view "$1" --json body --jq .body)
            printf '%s\n\n%s\n' "$2" "$body" > notes.md
            gh release edit "$1" --title "$3" --notes-file notes.md
          }
          note v1.2.2 "**The standard game.** Bots for 3 and 4 players use Paranoid search; Easy, Medium and Hard search 3, 4 and 5 moves ahead, at most about 2 seconds a move." "Tactical Formation v1.2.2 (standard)"
          note v1.3.0 "**The same game with Best-Reply Search** for the 3- and 4-player bots; Easy, Medium and Hard search 4, 5 and 6 moves ahead in every mode, however long it takes." "Tactical Formation v1.3.0 (with Best-Reply Search)"
          gh release edit v1.2.2 --latest
