name: web

# Publishes the browser version (web/) on GitHub Pages, after checking that
# its rules engine still plays exactly like the Python one.

on:
  push:
    branches: [main]
    paths: ['web/**', 'core/**', 'ai/**', 'tests/test_web.py', 'tests/web_replay.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python and dependencies from uv.lock
        run: uv sync --locked
      - name: Compare the browser version with the Python engine
        run: uv run python -m unittest tests.test_web -v

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
