name: build

# Ready-to-run copies of the game: a .exe for Windows, a .dmg for macOS and a
# program for Linux, each one file that is not zipped.
# Run by hand from the Actions tab (the files are kept as run artifacts), or
# push a version tag such as v1.1.0 to publish them on a GitHub release.
# Run by hand with a version, it makes that tag and release from the branch.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Version to publish as a release, for example v1.1.1 (empty = only build)
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Linux program needs the glibc of the system it is built on or
        # newer, so it is built on the oldest Ubuntu runner (22.04, glibc 2.35).
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the tests first
        run: uv run python -m unittest discover -s tests
      - name: Build
        run: uv run tools/build_app.py
      # Unzipped, the artifact is the file itself and is named after it.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/TacticalFormation-*
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # The pushed tag, or the version typed in when run by hand.
      TAG: ${{ inputs.release || github.ref_name }}
    steps:
      - name: A tag that already exists must be the commit built here
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha) || exit 0
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::${TAG} already points at ${sha}, but this run built ${GITHUB_SHA}"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: files
          pattern: TacticalFormation-*
          merge-multiple: true
      - name: Publish the release
        run: >
          gh release create "${TAG}" files/*
          --repo "${GITHUB_REPOSITORY}"
          --target "${GITHUB_SHA}"
          --title "Tactical Formation ${TAG}"
          --generate-notes
