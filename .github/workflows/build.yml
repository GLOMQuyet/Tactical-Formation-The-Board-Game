name: build

# Ready-to-run copies of the game: a .exe for Windows, a .dmg for macOS and a
# program for Linux, each one file that is not zipped.
# Run by hand from the Actions tab (the files are kept as run artifacts), or
# push a version tag such as v1.1.0 to publish them on a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Linux program needs the glibc of the system it is built on or
        # newer, so it is built on the oldest Ubuntu runner (22.04, glibc 2.35).
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the tests first
        run: uv run python -m unittest discover -s tests
      - name: Build
        run: uv run tools/build_app.py
      # Unzipped, the artifact is the file itself and is named after it.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/TacticalFormation-*
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          pattern: TacticalFormation-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" files/*
          --repo "${GITHUB_REPOSITORY}"
          --title "Tactical Formation ${GITHUB_REF_NAME}"
          --generate-notes
